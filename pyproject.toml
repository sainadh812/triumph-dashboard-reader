[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triumph-dashboard-reader"
version = "0.1.0"
description = "Experimental Colab dashboard, speed and RPM video reader"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "torch>=2.6,<3", "torchvision>=0.21,<1"]

[project.scripts]
triumph-dashboard-read = "triumph_dashboard_reader.run:main"

[tool.setuptools.packages.find]
where = ["src"]
